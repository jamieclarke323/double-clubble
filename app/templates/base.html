<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Double Clubble{% endblock %} - Charlton Athletic Quiz</title>
  <meta name="theme-color" content="#d0021b">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('quiz.index') }}">
      <img class="brand-icon" src="{{ url_for('static', filename='img/sword-icon-white.png') }}" alt="">
      <span class="brand-double">DOUBLE</span>
      <span class="brand-clubble">CLUBBLE</span>
    </a>
    <p class="brand-tagline">Name the Charlton Athletic &amp; players who have also played for the opposition</p>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Double Clubble &mdash; an unofficial Charlton Athletic fan quiz.</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
